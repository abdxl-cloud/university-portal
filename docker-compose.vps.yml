services:
  backend:
    build:
      context: ./backend
      network: host
    container_name: university_portal_backend
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://formbuilder:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/formbuilder?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://109.205.181.4:3014,http://localhost:3014
      IDENTITY_SECRET: ${IDENTITY_SECRET:?set IDENTITY_SECRET}
      IDENTITY_TOKEN_TTL: 5m
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Serves the React Router frontend, including the /prototype route, on :3014.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: university_portal_frontend
    ports:
      - "3014:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: university_portal_postgres
    environment:
      POSTGRES_USER: formbuilder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: formbuilder
    volumes:
      - university_portal_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: university_portal_redis
    restart: unless-stopped

volumes:
  university_portal_postgres_data:
