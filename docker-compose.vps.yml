services:
  backend:
    build:
      context: ./backend
      network: host
    container_name: university_portal_backend
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://formbuilder:formbuilder@postgres:5432/formbuilder?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://109.205.181.4:3014,http://localhost:3014
      IDENTITY_SECRET: ${IDENTITY_SECRET:-dev-identity-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Serves the static prototype (React + Babel via CDN, no build step) on :3014.
  frontend:
    image: nginx:alpine
    container_name: university_portal_frontend
    volumes:
      - ./prototype:/usr/share/nginx/html:ro
    ports:
      - "3014:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: university_portal_postgres
    environment:
      POSTGRES_USER: formbuilder
      POSTGRES_PASSWORD: formbuilder
      POSTGRES_DB: formbuilder
    volumes:
      - university_portal_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: university_portal_redis
    restart: unless-stopped

volumes:
  university_portal_postgres_data: