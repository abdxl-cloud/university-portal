services:
  api:
    image: abduldaro/university-portal-backend:prototype-react-project
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      LOG_LEVEL: debug
      DATABASE_URL: postgres://formbuilder:formbuilder@postgres:5432/formbuilder?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3014,http://localhost:3014,http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4174,http://localhost:4174,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      IDENTITY_SECRET: replace-with-at-least-32-random-characters
      IDENTITY_TOKEN_TTL: 5m
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: formbuilder
      POSTGRES_PASSWORD: formbuilder
      POSTGRES_DB: formbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formbuilder -d formbuilder"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
